<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="url(#bg3)"/>

  <text x="500" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="800">Partner Journey</text>
  <text x="500" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">List your venue or coaching service · get paid via Stripe</text>

  <g>
    <circle cx="125" cy="160" r="42" fill="url(#step3)" stroke="#60a5fa" stroke-width="2"/>
    <text x="125" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">1</text>
    <text x="125" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Sign up</text>
    <text x="125" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Venue or coach</text>
  </g>

  <g>
    <circle cx="320" cy="160" r="42" fill="url(#step3)" stroke="#60a5fa" stroke-width="2"/>
    <text x="320" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">2</text>
    <text x="320" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Connect Stripe</text>
    <text x="320" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">One-time onboarding</text>
  </g>

  <g>
    <circle cx="515" cy="160" r="42" fill="url(#step3)" stroke="#60a5fa" stroke-width="2"/>
    <text x="515" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">3</text>
    <text x="515" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Open slots</text>
    <text x="515" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Set your calendar</text>
  </g>

  <g>
    <circle cx="710" cy="160" r="42" fill="url(#step3)" stroke="#60a5fa" stroke-width="2"/>
    <text x="710" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">4</text>
    <text x="710" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Approve bookings</text>
    <text x="710" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Push notifications</text>
  </g>

  <g>
    <circle cx="890" cy="160" r="42" fill="url(#step3)" stroke="#60a5fa" stroke-width="2"/>
    <text x="890" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">5</text>
    <text x="890" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Get paid</text>
    <text x="890" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Direct to bank</text>
  </g>

  <line x1="167" y1="160" x2="278" y2="160" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="362" y1="160" x2="473" y2="160" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="557" y1="160" x2="668" y2="160" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="752" y1="160" x2="848" y2="160" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow3)"/>

  <text x="500" y="295" text-anchor="middle" fill="#475569" font-size="11">Analytics dashboard tracks revenue, bookings, and ratings</text>
</svg>
