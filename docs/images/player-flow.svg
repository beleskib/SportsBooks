<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="url(#bg2)"/>

  <text x="500" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="800">Player Journey</text>
  <text x="500" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">From signup to playing — 5 taps</text>

  <!-- Step circles -->
  <g>
    <circle cx="100" cy="160" r="42" fill="url(#step)" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">1</text>
    <text x="100" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Sign up</text>
    <text x="100" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Pick role &amp; sports</text>
  </g>

  <g>
    <circle cx="280" cy="160" r="42" fill="url(#step)" stroke="#34d399" stroke-width="2"/>
    <text x="280" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">2</text>
    <text x="280" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Browse</text>
    <text x="280" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Venues &amp; coaches</text>
  </g>

  <g>
    <circle cx="460" cy="160" r="42" fill="url(#step)" stroke="#34d399" stroke-width="2"/>
    <text x="460" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">3</text>
    <text x="460" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Pick a slot</text>
    <text x="460" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">9:00 – 22:00</text>
  </g>

  <g>
    <circle cx="640" cy="160" r="42" fill="url(#step)" stroke="#34d399" stroke-width="2"/>
    <text x="640" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">4</text>
    <text x="640" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Pay &amp; confirm</text>
    <text x="640" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Stripe checkout</text>
  </g>

  <g>
    <circle cx="820" cy="160" r="42" fill="url(#step)" stroke="#34d399" stroke-width="2"/>
    <text x="820" y="168" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="800">5</text>
    <text x="820" y="225" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Show up &amp; play</text>
    <text x="820" y="244" text-anchor="middle" fill="#94a3b8" font-size="11">Rate after</text>
  </g>

  <!-- Arrows -->
  <line x1="142" y1="160" x2="238" y2="160" stroke="#34d399" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="322" y1="160" x2="418" y2="160" stroke="#34d399" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="502" y1="160" x2="598" y2="160" stroke="#34d399" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="682" y1="160" x2="778" y2="160" stroke="#34d399" stroke-width="3" marker-end="url(#arrow2)"/>

  <text x="500" y="295" text-anchor="middle" fill="#475569" font-size="11">Push notifications keep players updated at every step</text>
</svg>
