<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0701"/>
    </linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0438"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-dim" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>

  <text x="500" y="40" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="800">SportsBooks · System Architecture</text>

  <!-- Clients row -->
  <text x="60" y="90" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">CLIENTS</text>
  <g>
    <rect x="60"  y="100" width="220" height="80" rx="12" fill="url(#client)" stroke="#60a5fa" stroke-width="2"/>
    <text x="170" y="135" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Android App</text>
    <text x="170" y="158" text-anchor="middle" fill="#94a3b8" font-size="12">Kotlin · Compose · Hilt</text>
  </g>
  <g>
    <rect x="390" y="100" width="220" height="80" rx="12" fill="url(#client)" stroke="#60a5fa" stroke-width="2"/>
    <text x="500" y="135" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">iOS App</text>
    <text x="500" y="158" text-anchor="middle" fill="#94a3b8" font-size="12">Swift · SwiftUI</text>
  </g>
  <g>
    <rect x="720" y="100" width="220" height="80" rx="12" fill="url(#client)" stroke="#60a5fa" stroke-width="2"/>
    <text x="830" y="135" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Web Dashboard</text>
    <text x="830" y="158" text-anchor="middle" fill="#94a3b8" font-size="12">React · Vite · Tailwind</text>
  </g>

  <!-- Backend row -->
  <text x="60" y="240" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">BACKEND</text>
  <g>
    <rect x="200" y="250" width="600" height="120" rx="12" fill="url(#backend)" stroke="#34d399" stroke-width="2"/>
    <text x="500" y="285" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700">REST API</text>
    <text x="500" y="305" text-anchor="middle" fill="#94a3b8" font-size="12">Node.js · Express · TypeScript</text>

    <rect x="220" y="320" width="170" height="34" rx="6" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="305" y="342" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">Rate Limiter</text>

    <rect x="415" y="320" width="170" height="34" rx="6" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="500" y="342" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">Auth Middleware</text>

    <rect x="610" y="320" width="170" height="34" rx="6" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="695" y="342" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">Controllers</text>
  </g>

  <!-- Data row -->
  <text x="60" y="430" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">DATA</text>
  <g>
    <rect x="60"  y="440" width="280" height="100" rx="12" fill="url(#data)" stroke="#fbbf24" stroke-width="2"/>
    <text x="200" y="475" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">PostgreSQL 16</text>
    <text x="200" y="498" text-anchor="middle" fill="#94a3b8" font-size="11">users · venues · coaches</text>
    <text x="200" y="515" text-anchor="middle" fill="#94a3b8" font-size="11">bookings · payments · reviews</text>
  </g>

  <text x="380" y="430" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">EXTERNAL SERVICES</text>
  <g>
    <rect x="380" y="440" width="180" height="100" rx="12" fill="url(#external)" stroke="#a78bfa" stroke-width="2"/>
    <text x="470" y="478" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Firebase</text>
    <text x="470" y="498" text-anchor="middle" fill="#94a3b8" font-size="11">Auth · FCM · Storage</text>
  </g>
  <g>
    <rect x="580" y="440" width="180" height="100" rx="12" fill="url(#external)" stroke="#a78bfa" stroke-width="2"/>
    <text x="670" y="478" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Stripe Connect</text>
    <text x="670" y="498" text-anchor="middle" fill="#94a3b8" font-size="11">Payments · Payouts</text>
  </g>
  <g>
    <rect x="780" y="440" width="160" height="100" rx="12" fill="url(#external)" stroke="#a78bfa" stroke-width="2"/>
    <text x="860" y="478" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Twilio / Email</text>
    <text x="860" y="498" text-anchor="middle" fill="#94a3b8" font-size="11">Notifications</text>
  </g>

  <!-- Arrows clients → backend -->
  <line x1="170" y1="180" x2="380" y2="250" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="180" x2="500" y2="250" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="180" x2="620" y2="250" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows backend → data/external -->
  <line x1="350" y1="370" x2="200" y2="440" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="370" x2="470" y2="440" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="370" x2="670" y2="440" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="370" x2="860" y2="440" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Token verification dotted line -->
  <line x1="500" y1="180" x2="470" y2="440" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="535" y="320" fill="#64748b" font-size="10" font-style="italic">verify token</text>

  <!-- Footer -->
  <text x="500" y="595" text-anchor="middle" fill="#475569" font-size="11">All client requests authenticated via Firebase ID tokens · Rate-limited at the gateway</text>
</svg>
