<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venue Map</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:393px; height:852px; background:#121212; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; overflow:hidden; position:relative; }

  .map-area {
    position:absolute; top:0; left:0; right:0; bottom:0;
    background:linear-gradient(135deg,#1a2a1a 0%,#0d1a0d 50%,#1a1a2a 100%);
  }
  .map-grid { position:absolute; top:0; left:0; right:0; bottom:0; opacity:0.1; }
  .map-road { position:absolute; background:rgba(255,255,255,0.05); }
  .road-h1 { top:200px; left:0; right:0; height:3px; }
  .road-h2 { top:400px; left:0; right:0; height:4px; }
  .road-h3 { top:550px; left:0; right:0; height:3px; }
  .road-v1 { top:0; bottom:0; left:100px; width:3px; }
  .road-v2 { top:0; bottom:0; left:250px; width:4px; }
  .road-v3 { top:0; bottom:0; left:350px; width:3px; }

  .map-pin {
    position:absolute; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    transform:translate(-50%, -100%); z-index:2;
  }
  .pin-bubble {
    background:#4CAF50; padding:8px 12px; border-radius:10px; font-size:12px;
    font-weight:700; white-space:nowrap; box-shadow:0 4px 12px rgba(76,175,80,0.4);
  }
  .pin-bubble.selected { background:#fff; color:#121212; transform:scale(1.1); }
  .pin-arrow { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid #4CAF50; }
  .pin-bubble.selected + .pin-arrow { border-top-color:#fff; }

  .user-loc {
    position:absolute; top:420px; left:196px; width:16px; height:16px;
    border-radius:50%; background:#2196F3; border:3px solid #fff;
    box-shadow:0 0 20px rgba(33,150,243,0.5); z-index:3;
    transform:translate(-50%,-50%);
  }
  .user-pulse {
    position:absolute; top:420px; left:196px; width:40px; height:40px;
    border-radius:50%; background:rgba(33,150,243,0.15);
    transform:translate(-50%,-50%); animation:pulse 2s infinite;
  }
  @keyframes pulse { 0%{transform:translate(-50%,-50%) scale(1);opacity:1} 100%{transform:translate(-50%,-50%) scale(2);opacity:0} }

  .top-controls {
    position:absolute; top:52px; left:16px; right:16px; z-index:10;
    display:flex; gap:10px;
  }
  .search-bar {
    flex:1; display:flex; align-items:center; gap:10px; background:rgba(30,30,30,0.95);
    border-radius:14px; padding:12px 16px; backdrop-filter:blur(10px);
  }
  .search-text { color:#888; font-size:14px; }
  .filter-btn {
    width:48px; height:48px; border-radius:14px; background:rgba(30,30,30,0.95);
    border:none; color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(10px);
  }

  .sport-filters {
    position:absolute; top:112px; left:16px; right:16px; z-index:10;
    display:flex; gap:8px; overflow-x:auto;
  }
  .sport-chip {
    padding:8px 14px; border-radius:20px; background:rgba(30,30,30,0.9);
    color:#888; font-size:12px; font-weight:600; white-space:nowrap; border:none; cursor:pointer;
    backdrop-filter:blur(10px);
  }
  .sport-chip.active { background:#4CAF50; color:#fff; }

  .recenter-btn {
    position:absolute; bottom:280px; right:16px; width:44px; height:44px;
    border-radius:50%; background:rgba(30,30,30,0.95); border:none; color:#fff;
    font-size:20px; display:flex; align-items:center; justify-content:center; z-index:10;
    backdrop-filter:blur(10px);
  }

  .venue-preview {
    position:absolute; bottom:96px; left:16px; right:16px; z-index:10;
    background:rgba(30,30,30,0.95); border-radius:20px; padding:16px;
    backdrop-filter:blur(10px); display:flex; gap:14px; align-items:center;
  }
  .preview-img { width:64px; height:64px; border-radius:14px; background:#252525; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
  .preview-info { flex:1; }
  .preview-name { font-size:16px; font-weight:700; }
  .preview-meta { font-size:13px; color:#888; margin-top:4px; }
  .preview-row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .preview-price { font-size:14px; color:#4CAF50; font-weight:700; }
  .preview-book { padding:8px 20px; background:#4CAF50; border:none; border-radius:10px; color:#fff; font-size:13px; font-weight:700; cursor:pointer; }

  .bottom-nav { position:absolute; bottom:0; left:0; width:393px; height:80px; background:rgba(26,26,26,0.98); border-top:1px solid #2A2A2A; display:flex; z-index:10; }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#666; font-size:10px; }
  .nav-item.active { color:#4CAF50; }
  .nav-icon { font-size:22px; }
</style>
</head>
<body>
  <div class="map-area">
    <div class="map-road road-h1"></div>
    <div class="map-road road-h2"></div>
    <div class="map-road road-h3"></div>
    <div class="map-road road-v1"></div>
    <div class="map-road road-v2"></div>
    <div class="map-road road-v3"></div>

    <div class="user-pulse"></div>
    <div class="user-loc"></div>

    <div class="map-pin" style="top:300px; left:160px;">
      <div class="pin-bubble selected">$50/h ★4.8</div>
      <div class="pin-arrow"></div>
    </div>
    <div class="map-pin" style="top:250px; left:300px;">
      <div class="pin-bubble">$40/h</div>
      <div class="pin-arrow"></div>
    </div>
    <div class="map-pin" style="top:180px; left:80px;">
      <div class="pin-bubble">$35/h</div>
      <div class="pin-arrow"></div>
    </div>
    <div class="map-pin" style="top:480px; left:320px;">
      <div class="pin-bubble">$55/h</div>
      <div class="pin-arrow"></div>
    </div>
    <div class="map-pin" style="top:520px; left:120px;">
      <div class="pin-bubble">$30/h</div>
      <div class="pin-arrow"></div>
    </div>
  </div>

  <div class="top-controls">
    <div class="search-bar">
      <span>🔍</span>
      <span class="search-text">Search this area</span>
    </div>
    <button class="filter-btn">⚙</button>
  </div>

  <div class="sport-filters">
    <button class="sport-chip active">All Sports</button>
    <button class="sport-chip">🎾 Tennis</button>
    <button class="sport-chip">⚽ Football</button>
    <button class="sport-chip">🏀 Basketball</button>
    <button class="sport-chip">🏸 Paddle</button>
  </div>

  <button class="recenter-btn">◎</button>

  <div class="venue-preview">
    <div class="preview-img">🎾</div>
    <div class="preview-info">
      <div class="preview-name">Champions Tennis Club</div>
      <div class="preview-meta">📍 1.2 km • ★ 4.8 (127 reviews)</div>
      <div class="preview-row">
        <span class="preview-price">From $50/h</span>
        <button class="preview-book">Book Now</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item"><span class="nav-icon">🏠</span>Home</div>
    <div class="nav-item active"><span class="nav-icon">🔍</span>Explore</div>
    <div class="nav-item"><span class="nav-icon">⚡</span>Play</div>
    <div class="nav-item"><span class="nav-icon">👥</span>Social</div>
    <div class="nav-item"><span class="nav-icon">☰</span>More</div>
  </div>
</body>
</html>
