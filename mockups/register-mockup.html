<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:393px; min-height:852px; background:#121212; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; overflow-x:hidden; }

  .header { padding:56px 24px 0; display:flex; align-items:center; gap:16px; }
  .back-btn { width:40px; height:40px; border-radius:50%; background:#1E1E1E; border:none; color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; }
  .header-title { font-size:20px; font-weight:700; }

  .top-section { padding:24px 24px 0; text-align:center; }
  .top-sub { font-size:14px; color:#888; margin-top:4px; }

  .role-selector { display:flex; gap:12px; padding:24px; }
  .role-card {
    flex:1; padding:16px; border-radius:16px; border:2px solid #333;
    background:#1E1E1E; text-align:center; cursor:pointer; transition:all 0.2s;
  }
  .role-card.active { border-color:#4CAF50; background:rgba(76,175,80,0.1); }
  .role-icon { font-size:32px; margin-bottom:8px; }
  .role-name { font-size:14px; font-weight:700; }
  .role-desc { font-size:11px; color:#888; margin-top:4px; }

  .form-section { padding:0 24px; }
  .input-group { margin-bottom:14px; }
  .input-label { font-size:13px; color:#888; margin-bottom:6px; display:block; }
  .input-field {
    width:100%; padding:14px 16px; background:#1E1E1E; border:1px solid #333;
    border-radius:12px; color:#fff; font-size:15px; outline:none;
  }
  .input-field::placeholder { color:#555; }
  .name-row { display:flex; gap:12px; }
  .name-row .input-group { flex:1; }

  .password-strength { margin-top:6px; display:flex; gap:4px; }
  .strength-bar { flex:1; height:3px; border-radius:2px; background:#333; }
  .strength-bar.filled { background:#4CAF50; }
  .strength-bar.medium { background:#FF9800; }

  .terms { padding:0 24px; margin-top:16px; font-size:12px; color:#888; line-height:1.5; }
  .terms a { color:#4CAF50; text-decoration:none; }

  .register-btn {
    margin:20px 24px; width:calc(100% - 48px); padding:16px;
    background:linear-gradient(135deg,#4CAF50,#2E7D32);
    border:none; border-radius:14px; color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }

  .divider { display:flex; align-items:center; margin:16px 24px; }
  .divider-line { flex:1; height:1px; background:#333; }
  .divider-text { padding:0 16px; color:#555; font-size:13px; }

  .social-btns { padding:0 24px; display:flex; gap:12px; }
  .social-btn {
    flex:1; padding:14px; border-radius:12px; border:1px solid #333;
    background:#1E1E1E; color:#fff; font-size:14px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }

  .login-link { text-align:center; margin-top:24px; padding-bottom:40px; font-size:14px; color:#888; }
  .login-link a { color:#4CAF50; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="header">
    <button class="back-btn">&#8249;</button>
    <span class="header-title">Create Account</span>
  </div>

  <div class="top-section">
    <div class="top-sub">Join the community</div>
  </div>

  <div class="role-selector">
    <div class="role-card active">
      <div class="role-icon">&#127939;</div>
      <div class="role-name">Player</div>
      <div class="role-desc">Book &amp; play</div>
    </div>
    <div class="role-card">
      <div class="role-icon">&#127970;</div>
      <div class="role-name">Venue Owner</div>
      <div class="role-desc">List your venue</div>
    </div>
    <div class="role-card">
      <div class="role-icon">&#127941;</div>
      <div class="role-name">Coach</div>
      <div class="role-desc">Offer sessions</div>
    </div>
  </div>

  <div class="form-section">
    <div class="name-row">
      <div class="input-group">
        <label class="input-label">First Name</label>
        <input class="input-field" placeholder="John">
      </div>
      <div class="input-group">
        <label class="input-label">Last Name</label>
        <input class="input-field" placeholder="Doe">
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">Email</label>
      <input class="input-field" type="email" placeholder="your@email.com">
    </div>
    <div class="input-group">
      <label class="input-label">Password</label>
      <input class="input-field" type="password" placeholder="Min. 8 characters">
      <div class="password-strength">
        <div class="strength-bar filled"></div>
        <div class="strength-bar filled"></div>
        <div class="strength-bar medium"></div>
        <div class="strength-bar"></div>
      </div>
    </div>
    <div class="input-group">
      <label class="input-label">Phone (optional)</label>
      <input class="input-field" type="tel" placeholder="+1 (555) 000-0000">
    </div>
  </div>

  <div class="terms">
    By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
  </div>

  <button class="register-btn">Create Account</button>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or</span>
    <div class="divider-line"></div>
  </div>

  <div class="social-btns">
    <button class="social-btn"><span>G</span> Google</button>
    <button class="social-btn"><span>&#63743;</span> Apple</button>
  </div>

  <div class="login-link">
    Already have an account? <a href="#">Log in</a>
  </div>
</body>
</html>
