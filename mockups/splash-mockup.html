<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Screen</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:393px; min-height:852px; background:#121212; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-x:hidden; }

  .splash-container {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:852px; width:100%; position:relative;
  }

  .logo-circle {
    width:120px; height:120px; border-radius:50%;
    background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 60px rgba(76,175,80,0.3);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 60px rgba(76,175,80,0.3); transform:scale(1); }
    50% { box-shadow: 0 0 80px rgba(76,175,80,0.5); transform:scale(1.05); }
  }

  .logo-icon { font-size:56px; }

  .app-name {
    font-size:32px; font-weight:800; margin-top:24px;
    background: linear-gradient(135deg, #4CAF50, #81C784);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:1px;
  }

  .app-tagline {
    font-size:14px; color:#888; margin-top:8px; letter-spacing:2px; text-transform:uppercase;
  }

  .loading-bar {
    position:absolute; bottom:120px; width:200px; height:3px;
    background:#1E1E1E; border-radius:2px; overflow:hidden;
  }
  .loading-bar::after {
    content:''; position:absolute; left:-50%; width:50%; height:100%;
    background: linear-gradient(90deg, transparent, #4CAF50, transparent);
    animation: loading 1.5s ease-in-out infinite;
  }
  @keyframes loading {
    0% { left:-50%; }
    100% { left:100%; }
  }

  .version {
    position:absolute; bottom:60px; font-size:12px; color:#555;
  }
</style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-circle">
      <span class="logo-icon">&#9917;</span>
    </div>
    <div class="app-name">SportsBooks</div>
    <div class="app-tagline">Book &bull; Play &bull; Compete</div>
    <div class="loading-bar"></div>
    <div class="version">v2.0.0</div>
  </div>
</body>
</html>
