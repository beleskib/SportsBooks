<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:393px; min-height:852px; background:#121212; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; overflow-x:hidden; }

  .top-section {
    padding:80px 24px 40px; text-align:center;
  }
  .logo-sm { width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#4CAF50,#2E7D32); display:inline-flex; align-items:center; justify-content:center; font-size:36px; box-shadow:0 0 40px rgba(76,175,80,0.25); }
  .app-title { font-size:28px; font-weight:800; margin-top:16px; background:linear-gradient(135deg,#4CAF50,#81C784); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .app-sub { font-size:14px; color:#888; margin-top:4px; }

  .form-section { padding:0 24px; margin-top:32px; }
  .input-group { margin-bottom:16px; }
  .input-label { font-size:13px; color:#888; margin-bottom:6px; display:block; }
  .input-field {
    width:100%; padding:14px 16px; background:#1E1E1E; border:1px solid #333;
    border-radius:12px; color:#fff; font-size:15px; outline:none;
  }
  .input-field:focus { border-color:#4CAF50; }
  .input-field::placeholder { color:#555; }

  .password-wrapper { position:relative; }
  .eye-icon { position:absolute; right:16px; top:50%; transform:translateY(-50%); color:#555; font-size:18px; cursor:pointer; }

  .forgot { text-align:right; margin-top:8px; }
  .forgot a { color:#4CAF50; font-size:13px; text-decoration:none; }

  .login-btn {
    width:100%; padding:16px; background:linear-gradient(135deg,#4CAF50,#2E7D32);
    border:none; border-radius:14px; color:#fff; font-size:16px; font-weight:700;
    margin-top:24px; cursor:pointer; letter-spacing:0.5px;
  }

  .divider {
    display:flex; align-items:center; margin:28px 0; padding:0 24px;
  }
  .divider-line { flex:1; height:1px; background:#333; }
  .divider-text { padding:0 16px; color:#555; font-size:13px; }

  .social-btns { padding:0 24px; display:flex; flex-direction:column; gap:12px; }
  .social-btn {
    width:100%; padding:14px; border-radius:12px; border:1px solid #333;
    background:#1E1E1E; color:#fff; font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:12px; cursor:pointer;
  }
  .social-btn.google { border-color:#4285F4; }
  .social-btn.apple { border-color:#fff; }
  .social-icon { font-size:20px; }

  .signup-link {
    text-align:center; margin-top:32px; padding-bottom:40px;
    font-size:14px; color:#888;
  }
  .signup-link a { color:#4CAF50; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="top-section">
    <div class="logo-sm"><span>&#9917;</span></div>
    <div class="app-title">SportsBooks</div>
    <div class="app-sub">Welcome back</div>
  </div>

  <div class="form-section">
    <div class="input-group">
      <label class="input-label">Email</label>
      <input class="input-field" type="email" placeholder="your@email.com">
    </div>
    <div class="input-group">
      <label class="input-label">Password</label>
      <div class="password-wrapper">
        <input class="input-field" type="password" placeholder="Enter password">
        <span class="eye-icon">&#128065;</span>
      </div>
    </div>
    <div class="forgot"><a href="#">Forgot password?</a></div>
    <button class="login-btn">Log In</button>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or continue with</span>
    <div class="divider-line"></div>
  </div>

  <div class="social-btns">
    <button class="social-btn google">
      <span class="social-icon">G</span> Continue with Google
    </button>
    <button class="social-btn apple">
      <span class="social-icon">&#63743;</span> Continue with Apple
    </button>
  </div>

  <div class="signup-link">
    Don't have an account? <a href="#">Sign up</a>
  </div>
</body>
</html>
